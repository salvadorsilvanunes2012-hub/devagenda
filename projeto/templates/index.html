<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Bloqueio de comportamento de seleção e toque longo */
        * { 
            touch-action: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
            box-sizing: border-box;
        }
        
        body { 
            margin: 0; background: #333; color: white; font-family: sans-serif; overflow: hidden; 
            width: 100vw; height: 100vh; display: flex; 
            align-items: flex-end; 
            justify-content: space-between; 
            padding: 20px 40px 30px 40px;
        }

        /* Elementos fixos */
        #gps-box { width: 150px; height: 100px; background: #000; border: 2px solid #fff; position: absolute; top: 10px; right: 10px; z-index: 10;}
        #robot-marker { position: absolute; width: 10px; height: 10px; background: red; border-radius: 50%; left: 70px; top: 45px; transition: 0.1s; }
        .light-btn { width: 60px; height: 60px; border-radius: 50%; background: #444; border: 2px solid #fff; font-size: 25px; position: absolute; top: 10px; left: 10px; z-index: 10;}

        /* Zonas de Controlo */
        .left-zone { display: flex; gap: 20px; }
        
        /* Pedais lado a lado */
        .right-zone { 
            display: flex; 
            flex-direction: row; 
            gap: 10px; 
            align-items: center;
        }

        .btn-steer { width: 90px; height: 90px; border-radius: 50%; background: #555; border: none; color: white; font-size: 30px; }
        
        .pedal { 
            width: 90px; height: 80px; 
            background: #999; border: 4px solid #555; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; color: #000; font-size: 18px; 
        }
    </style>
</head>
<body>

    <button class="light-btn" onpointerdown="enviar('farois')">💡</button>

    <div id="gps-box"><div id="robot-marker"></div></div>

    <div class="left-zone">
        <button class="btn-steer" onpointerdown="mover('esq')" onpointerup="parar()">⬅️</button>
        <button class="btn-steer" onpointerdown="mover('dir')" onpointerup="parar()">➡️</button>
    </div>

    <div class="right-zone">
        <div class="pedal" onpointerdown="mover('frente')" onpointerup="parar()">GAS</div>
        <div class="pedal" onpointerdown="mover('tras')" onpointerup="parar()">TRAV</div>
    </div>

    <script>
        let x = 70, y = 45;
        let timer;

        function mover(cmd) {
            if (window.navigator.vibrate) navigator.vibrate(30);
            
            // Envia comando imediato
            fetch('/comando/' + cmd);

            // Inicia loop para manter comando ativo
            timer = setInterval(function() {
                fetch('/comando/' + cmd);
            }, 100);

            // Atualiza visual do mapa
            if(cmd === 'frente' && y > 10) y -= 10;
            if(cmd === 'tras' && y < 80) y += 10;
            if(cmd === 'esq' && x > 10) x -= 10;
            if(cmd === 'dir' && x < 130) x += 10;
            document.getElementById('robot-marker').style.left = x + 'px';
            document.getElementById('robot-marker').style.top = y + 'px';
        }
        
        function parar() {
            clearInterval(timer);
            fetch('/comando/parar');
        }

        function enviar(cmd) { 
            if (window.navigator.vibrate) navigator.vibrate(100); 
            fetch('/comando/' + cmd); 
        }

        document.body.ondblclick = function() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
    </script>
</body>
</html>
